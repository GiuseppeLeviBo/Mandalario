name: Service worker tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  service-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Run service worker regression tests
        run: node --test tests/sw.test.cjs
